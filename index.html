<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Tarefas</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f8fafc;color:#172033;margin:0;padding:24px 16px}.wrap{max-width:560px;margin:36px auto}h1{font-size:30px;margin:0 0 22px}form{display:flex;gap:8px}input[type=text]{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:12px;padding:14px;font-size:16px;background:white}button{border:0;border-radius:12px;padding:12px 17px;font-size:16px;cursor:pointer;background:#2563eb;color:white}ul{padding:0;list-style:none;margin-top:24px}li{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin-bottom:9px}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#94a3b8}li input{width:22px;height:22px;accent-color:#2563eb}li button{background:transparent;color:#64748b;padding:5px 9px}p{color:#64748b;text-align:center;margin-top:30px}</style></head><body><main class="wrap"><h1>Minhas tarefas</h1><form id="form"><input id="new" type="text" placeholder="Adicionar tarefa..." aria-label="Nova tarefa" maxlength="500" required><button type="submit">Adicionar</button></form><ul id="list"></ul><p id="empty">Nenhuma tarefa ainda.</p></main><script>const KEY='tarefas-simples-v1';let tasks=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(t=>t&&typeof t.text==='string')}catch(e){}const list=document.getElementById('list'),empty=document.getElementById('empty'),field=document.getElementById('new');function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('Não foi possível salvar as tarefas neste navegador.')}}function render(){list.replaceChildren();empty.hidden=tasks.length>0;tasks.forEach(t=>{const li=document.createElement('li');if(t.done)li.className='done';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Concluir tarefa');cb.onchange=()=>{t.done=cb.checked;save();render()};const span=document.createElement('span');span.textContent=t.text;const del=document.createElement('button');del.type='button';del.textContent='Excluir';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};li.append(cb,span,del);list.append(li)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();const text=field.value.trim();if(!text)return;tasks.unshift({id:Date.now()+'-'+Math.random(),text,done:false});save();field.value='';render();field.focus()};render();</script></body></html>

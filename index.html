<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Tarefas</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f8fafc;color:#172033;margin:0;padding:24px 16px}.wrap{max-width:560px;margin:36px auto}h1{font-size:30px;margin:0 0 22px}form{display:flex;gap:8px}input[type=text]{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:12px;padding:14px;font-size:16px;background:white}button{border:0;border-radius:12px;padding:12px 17px;font-size:16px;cursor:pointer;background:#2563eb;color:white}ul{padding:0;list-style:none;margin-top:24px}li{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin-bottom:9px}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#94a3b8}li input{width:22px;height:22px;accent-color:#2563eb}li button{background:transparent;color:#64748b;padding:5px 9px} .install{margin-top:14px;width:100%;background:#0f766e}.cyclehead{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}.cyclehead strong{font-size:17px}.cyclehead small{color:#64748b}.fixed{border-left:4px solid #2563eb}.fixed button.ok{background:#0f766e;color:white}.fixed .num{font-weight:700;color:#64748b;min-width:27px}.cycleinfo{color:#64748b;font-size:13px;margin:8px 0}.history{margin-top:20px;font-size:13px;color:#64748b}nav{display:flex;gap:8px;margin-top:20px}nav button{flex:1;background:#e2e8f0;color:#334155}nav button.active{background:#2563eb;color:white}p{color:#64748b;text-align:center;margin-top:30px}</style></head><body><main class="wrap"><h1>Minhas tarefas</h1><button id="install" class="install" type="button">Instalar aplicativo</button><form id="form"><input id="new" type="text" placeholder="Adicionar tarefa..." aria-label="Nova tarefa" maxlength="500" required><button type="submit">Adicionar</button></form><nav><button id="pendingTab" type="button" class="active">A fazer</button><button id="doneTab" type="button">Feitos</button></nav><div class="cyclehead"><strong id="cycleTitle">Ciclo 1</strong><small id="counter">0/48 feitos</small></div><div class="cycleinfo" id="cycleInfo">Sequência fixa de estudos</div><ul id="fixedList"></ul><h3 id="extrasTitle">Outras tarefas</h3><ul id="list"></ul><div class="history" id="history"></div><p id="empty">Nenhuma tarefa ainda.</p></main><script>const FIXED=["Economia + Finanças Públicas","LTE 1","Contabilidade Geral","Reforma (EC nº 132-2023 e LC nº 214-2025)","Finanças Públicas (Orçamento + LRF)","Discursiva — Ciência de Dados","Inteligência Artificial e Ciência de Dados","LTE 2","Contabilidade Pública","Auditoria Fiscal","Direito Administrativo","Discursiva — Auditoria Fiscal","Desenvolvimento de Sistemas","Direito Tributário","Forense Computacional","Reforma (LC nº 227-2026)","LTE 1","Discursiva — Finanças Públicas","Segurança da Informação e Redes","Reforma (EC nº 132-2023 e LC nº 214-2025)","Estatística e Probabilidade","Finanças Públicas (Orçamento + LRF)","Inteligência Artificial e Ciência de Dados","Discursiva — Reforma Tributária","Economia + Finanças Públicas","Auditoria Fiscal","Contabilidade Geral","Governança de TI","Direito Tributário","Discursiva — Ciência de Dados","Matemática Financeira","LTE 2","Contabilidade Pública","LTE 1","Reforma (EC nº 132-2023 e LC nº 214-2025)","Discursiva — Auditoria Fiscal","Desenvolvimento de Sistemas","Finanças Públicas (Orçamento + LRF)","Inteligência Artificial e Ciência de Dados","Reforma (LC nº 227-2026)","Auditoria Fiscal","Discursiva — Finanças Públicas","Segurança da Informação e Redes","Direito Constitucional","Estatística e Probabilidade","Direito Tributário","Engenharia de Software","Discursiva — Reforma Tributária"];const CKEY='tarefas-sefaz-ciclo-v1';let cycle={number:1,done:[],history:[]};try{const c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c&&Number.isInteger(c.number)&&Array.isArray(c.done)&&Array.isArray(c.history))cycle=c}catch(e){}function saveCycle(){try{localStorage.setItem(CKEY,JSON.stringify(cycle))}catch(e){alert('Falha ao salvar o ciclo.')}}function finishFixed(i){if(cycle.done.includes(i))return;cycle.done.push(i);if(cycle.done.length===FIXED.length){cycle.history.push({number:cycle.number,finishedAt:new Date().toISOString()});cycle.number++;cycle.done=[];saveCycle();render();alert('Ciclo concluído! Os 48 blocos voltaram para A fazer.')}else{saveCycle();render()}}function undoFixed(i){cycle.done=cycle.done.filter(x=>x!==i);saveCycle();render()}const fixedList=document.getElementById('fixedList');let tasks=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(t=>t&&typeof t.text==='string')}catch(e){}let tab='pending';const pendingTab=document.getElementById('pendingTab'),doneTab=document.getElementById('doneTab');pendingTab.onclick=()=>{tab='pending';render()};doneTab.onclick=()=>{tab='done';render()};const list=document.getElementById('list'),empty=document.getElementById('empty'),field=document.getElementById('new');function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('Não foi possível salvar as tarefas neste navegador.')}}function render(){list.replaceChildren();fixedList.replaceChildren();document.getElementById('cycleTitle').textContent='Ciclo '+cycle.number;document.getElementById('counter').textContent=cycle.done.length+'/48 feitos';document.getElementById('history').textContent=cycle.history.length?'Ciclos anteriores concluídos: '+cycle.history.map(h=>'Ciclo '+h.number+' ('+new Date(h.finishedAt).toLocaleDateString('pt-BR')+')').join(' • '):'';FIXED.forEach((name,i)=>{const done=cycle.done.includes(i);if(done!==(tab==='done'))return;const li=document.createElement('li');li.className='fixed'+(done?' done':'');const num=document.createElement('span');num.className='num';num.textContent=(i+1)+'.';const label=document.createElement('span');label.textContent=name;const b=document.createElement('button');b.type='button';b.className='ok';b.textContent=done?'Desfazer':'OK';b.onclick=()=>done?undoFixed(i):finishFixed(i);li.append(num,label,b);fixedList.append(li)});pendingTab.classList.toggle('active',tab==='pending');doneTab.classList.toggle('active',tab==='done');const visible=tasks.filter(t=>!!t.done===(tab==='done'));empty.hidden=visible.length>0||fixedList.childElementCount>0;document.getElementById('extrasTitle').hidden=visible.length===0;empty.textContent=tab==='done'?'Nenhuma tarefa concluída.':'Nenhuma tarefa pendente.';visible.forEach(t=>{const li=document.createElement('li');if(t.done)li.className='done';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Concluir tarefa');cb.onchange=()=>{t.done=cb.checked;save();render()};const span=document.createElement('span');span.textContent=t.text;const del=document.createElement('button');del.type='button';del.textContent='Excluir';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};li.append(cb,span,del);list.append(li)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();const text=field.value.trim();if(!text)return;tasks.unshift({id:Date.now()+'-'+Math.random(),text,done:false});save();field.value='';render();field.focus()};render();let installPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e});document.getElementById("install").onclick=async()=>{if(installPrompt){const p=installPrompt;installPrompt=null;await p.prompt()}else alert("Para instalar: abra o menu do navegador (⋮) e toque em Instalar aplicativo ou Adicionar à tela inicial.")};if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>

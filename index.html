<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Tarefas</title><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f8fafc;color:#172033;margin:0;padding:24px 16px}.wrap{max-width:560px;margin:36px auto}h1{font-size:30px;margin:0 0 22px}form{display:flex;gap:8px}input[type=text]{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:12px;padding:14px;font-size:16px;background:white}button{border:0;border-radius:12px;padding:12px 17px;font-size:16px;cursor:pointer;background:#2563eb;color:white}ul{padding:0;list-style:none;margin-top:24px}li{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin-bottom:9px}li span{flex:1;overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#94a3b8}li input{width:22px;height:22px;accent-color:#2563eb}li button{background:transparent;color:#64748b;padding:5px 9px} .install{margin-top:14px;width:100%;background:#0f766e}.cyclehead{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}.cyclehead strong{font-size:17px}.cyclehead small{color:#64748b}.fixed{border-left:4px solid #2563eb}.fixed button.ok{background:#0f766e;color:white}.fixed .num{font-weight:700;color:#64748b;min-width:27px}.cycleinfo{color:#64748b;font-size:13px;margin:8px 0}.history{margin-top:20px;font-size:13px;color:#64748b} .when{font-size:12px;color:#64748b;display:block;margin-top:5px}.taskbody{flex:1;min-width:0}.calendar{margin-top:24px;background:white;padding:15px;border:1px solid #e2e8f0;border-radius:14px}.calhead{display:flex;align-items:center;justify-content:space-between}.calhead button{padding:7px 12px}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}.day{border:1px solid #e2e8f0;background:#f8fafc;color:#172033;min-height:42px;padding:4px 0;font-size:13px}.day.has{background:#d1fae5;border-color:#10b981}.day.selected{outline:2px solid #2563eb}.day:disabled{opacity:.25}.day small{display:block;font-size:10px}.calentries{margin-top:12px}.calentries div{padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:13px}[hidden]{display:none!important}.subtabs{display:flex;gap:8px;margin-top:16px}.subtabs button{flex:1;background:#e2e8f0;color:#334155}.subtabs button.active{background:#2563eb;color:white}.focuswrap{text-align:center;margin:22px auto}.focuscircle{position:relative;isolation:isolate;width:min(86vw,350px);height:min(86vw,350px);border-radius:50%;margin:22px auto;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:53px;gap:13px;background:radial-gradient(circle at 40% 25%,#6d28d9,#2e1065 74%);border:3px solid #f5d48c;box-shadow:0 0 0 5px #7e22ce,0 0 0 9px #f5d48c,0 0 28px 12px #a855f788,0 14px 35px #581c8766}.focuscircle:before{content:"";position:absolute;inset:-27px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(from 0deg,#e9c46a 0deg 2deg,#9333ea 3deg 10deg,#4c1d95 11deg 17deg,#f0abfc 18deg 20deg,#4c1d95 21deg 30deg);clip-path:polygon(50% 0%,60% 12%,75% 5%,80% 21%,95% 25%,88% 40%,100% 50%,88% 60%,95% 75%,80% 79%,75% 95%,60% 88%,50% 100%,40% 88%,25% 95%,20% 79%,5% 75%,12% 60%,0% 50%,12% 40%,5% 25%,20% 21%,25% 5%,40% 12%);filter:drop-shadow(0 0 7px #c084fc)}@keyframes mandalaSpin{to{transform:rotate(360deg)}}.focuscircle.spinning:before{animation:mandalaSpin 6s linear infinite}.focuscircle:after{content:"";position:absolute;inset:15px;border-radius:50%;border:1px solid #e9c46a;box-shadow:inset 0 0 15px #c084fc99;pointer-events:none}.focuscircle strong{font-size:17px;letter-spacing:2px;color:#fde68a;text-shadow:0 0 8px #f0abfc}.focuscircle .focusname{font-size:17px;font-weight:700;overflow-wrap:anywhere;max-height:125px;overflow:auto;text-shadow:0 1px 5px #1e1b4b}.focuscircle button{background:linear-gradient(90deg,#7e22ce,#a855f7);border:2px solid #f5d48c;box-shadow:0 0 10px #e9c46a;color:white;font-weight:800}.focuscircle button[hidden]{display:none}.focuswrap select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:white;font-size:16px}.focuswrap label{display:block;margin:10px;font-weight:600}nav{display:flex;gap:8px;margin-top:20px}nav button{flex:1;background:#e2e8f0;color:#334155}nav button.active{background:#2563eb;color:white}p{color:#64748b;text-align:center;margin-top:30px}</style></head><body><main class="wrap"><h1>Minhas tarefas</h1><form id="form"><input id="new" type="text" placeholder="Adicionar tarefa..." aria-label="Nova tarefa" maxlength="500" required><button type="submit">Adicionar</button></form><nav><button id="pendingTab" type="button" class="active">A fazer</button><button id="doneTab" type="button">Feitos</button><button id="moreTab" type="button">Mais</button></nav><section id="morePanel" hidden><button id="install" class="install" type="button">Instalar aplicativo</button></section><div id="tasksPanel"><section class="focuswrap" id="focusPanel"><div class="focuscircle"><strong>TAREFA EM FOCO</strong><div id="focusName" class="focusname">Escolha uma tarefa</div><button id="focusFinish" type="button" hidden>Concluir ✓</button></div><label for="focusSelect">Escolher tarefa em foco</label><select id="focusSelect"></select></section><div class="subtabs"><button id="fixedTab" type="button" class="active">Ciclo fixo</button><button id="otherTab" type="button">Outras tarefas</button></div><section id="fixedPanel"><div class="cyclehead"><strong id="cycleTitle">Ciclo 1</strong><small id="counter">0/48 feitos</small></div><div class="cycleinfo" id="cycleInfo">Sequência fixa de estudos</div><ul id="fixedList"></ul></section><section id="otherPanel" hidden><ul id="list"></ul></section><div class="history" id="history"></div><section class="calendar"><div class="calhead"><button id="prevMonth" type="button">‹</button><strong id="monthTitle"></strong><button id="nextMonth" type="button">›</button></div><div class="calgrid" id="calgrid"></div><div class="calentries" id="calentries"></div></section><p id="empty">Nenhuma tarefa ainda.</p></div></main><script>const FIXED=["Economia + Finanças Públicas","LTE 1","Contabilidade Geral","Reforma (EC nº 132-2023 e LC nº 214-2025)","Finanças Públicas (Orçamento + LRF)","Discursiva — Ciência de Dados","Inteligência Artificial e Ciência de Dados","LTE 2","Contabilidade Pública","Auditoria Fiscal","Direito Administrativo","Discursiva — Auditoria Fiscal","Desenvolvimento de Sistemas","Direito Tributário","Forense Computacional","Reforma (LC nº 227-2026)","LTE 1","Discursiva — Finanças Públicas","Segurança da Informação e Redes","Reforma (EC nº 132-2023 e LC nº 214-2025)","Estatística e Probabilidade","Finanças Públicas (Orçamento + LRF)","Inteligência Artificial e Ciência de Dados","Discursiva — Reforma Tributária","Economia + Finanças Públicas","Auditoria Fiscal","Contabilidade Geral","Governança de TI","Direito Tributário","Discursiva — Ciência de Dados","Matemática Financeira","LTE 2","Contabilidade Pública","LTE 1","Reforma (EC nº 132-2023 e LC nº 214-2025)","Discursiva — Auditoria Fiscal","Desenvolvimento de Sistemas","Finanças Públicas (Orçamento + LRF)","Inteligência Artificial e Ciência de Dados","Reforma (LC nº 227-2026)","Auditoria Fiscal","Discursiva — Finanças Públicas","Segurança da Informação e Redes","Direito Constitucional","Estatística e Probabilidade","Direito Tributário","Engenharia de Software","Discursiva — Reforma Tributária"];const KEY='tarefas-simples-v1';const FOCUSKEY='tarefas-foco-v1';let focus=null;try{focus=JSON.parse(localStorage.getItem(FOCUSKEY)||'null')}catch(e){}function saveFocus(){localStorage.setItem(FOCUSKEY,JSON.stringify(focus))}const CKEY='tarefas-sefaz-ciclo-v1';let cycle={number:1,done:[],history:[],records:[]};try{const c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c&&Number.isInteger(c.number)&&Array.isArray(c.done)&&Array.isArray(c.history))cycle=c;if(!Array.isArray(cycle.records))cycle.records=[]}catch(e){}function saveCycle(){try{localStorage.setItem(CKEY,JSON.stringify(cycle))}catch(e){alert('Falha ao salvar o ciclo.')}}function finishFixed(i){if(cycle.done.includes(i))return;cycle.done.push(i);cycle.records.push({id:Date.now()+'-'+Math.random(),cycle:cycle.number,index:i,name:FIXED[i],at:new Date().toISOString()});if(cycle.done.length===FIXED.length){cycle.history.push({number:cycle.number,finishedAt:new Date().toISOString()});cycle.number++;cycle.done=[];saveCycle();render();alert('Ciclo concluído! Os 48 blocos voltaram para A fazer.')}else{saveCycle();render()}}function undoFixed(i){cycle.done=cycle.done.filter(x=>x!==i);cycle.records=cycle.records.filter(r=>!(r.cycle===cycle.number&&r.index===i));saveCycle();render()}const fixedList=document.getElementById('fixedList');let month=new Date();month.setDate(1);let selectedDay=new Date();function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function records(){return [...cycle.records.map(r=>({name:(r.index+1)+'. '+r.name,at:r.at,cycle:r.cycle})),...tasks.filter(t=>t.done&&t.completedAt).map(t=>({name:t.text,at:t.completedAt}))].filter(r=>r.at&&!Number.isNaN(new Date(r.at).getTime()))}function renderCalendar(){const grid=document.getElementById('calgrid');grid.replaceChildren();document.getElementById('monthTitle').textContent=month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const rec=records(),counts={};rec.forEach(r=>{const k=dateKey(new Date(r.at));counts[k]=(counts[k]||0)+1});['D','S','T','Q','Q','S','S'].forEach(x=>{const h=document.createElement('strong');h.textContent=x;h.style.textAlign='center';grid.append(h)});for(let i=0;i<month.getDay();i++){const b=document.createElement('span');grid.append(b)}const last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let d=1;d<=last;d++){const dt=new Date(month.getFullYear(),month.getMonth(),d),key=dateKey(dt),b=document.createElement('button');b.type='button';b.className='day'+(counts[key]?' has':'')+(dateKey(selectedDay)===key?' selected':'');b.textContent=d;if(counts[key]){const n=document.createElement('small');n.textContent=counts[key]+' ✓';b.append(n)}b.onclick=()=>{selectedDay=dt;renderCalendar()};grid.append(b)}const entries=document.getElementById('calentries');entries.replaceChildren();const title=document.createElement('strong');title.textContent='Concluídas em '+selectedDay.toLocaleDateString('pt-BR');entries.append(title);const chosen=rec.filter(r=>dateKey(new Date(r.at))===dateKey(selectedDay)).sort((a,b)=>new Date(a.at)-new Date(b.at));if(!chosen.length){const p=document.createElement('p');p.textContent='Nenhuma conclusão registrada neste dia.';entries.append(p)}chosen.forEach(r=>{const div=document.createElement('div');div.textContent=new Date(r.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' — '+r.name+(r.cycle?' (ciclo '+r.cycle+')':'');entries.append(div)})}document.getElementById('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);selectedDay=new Date(month);renderCalendar()};document.getElementById('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);selectedDay=new Date(month);renderCalendar()};let tasks=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(t=>t&&typeof t.text==='string')}catch(e){}let tab='pending',section='fixed';document.getElementById('fixedTab').onclick=()=>{section='fixed';render()};document.getElementById('otherTab').onclick=()=>{section='other';render()};const pendingTab=document.getElementById('pendingTab'),doneTab=document.getElementById('doneTab');pendingTab.onclick=()=>{tab='pending';render()};doneTab.onclick=()=>{tab='done';render()};document.getElementById('moreTab').onclick=()=>{tab='more';render()};const list=document.getElementById('list'),empty=document.getElementById('empty'),field=document.getElementById('new');function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){alert('Não foi possível salvar as tarefas neste navegador.')}}function renderFocus(){const sel=document.getElementById('focusSelect'),name=document.getElementById('focusName'),finish=document.getElementById('focusFinish');const choices=[...FIXED.map((text,i)=>({key:'fixed:'+i,text:(i+1)+'. '+text,available:!cycle.done.includes(i)})),...tasks.map(t=>({key:'other:'+t.id,text:t.text,available:!t.done}))].filter(x=>x.available);if(focus&&!choices.some(x=>x.key===focus)){focus=null;saveFocus()}sel.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent='Selecione uma tarefa';sel.append(blank);choices.forEach(x=>{const o=document.createElement('option');o.value=x.key;o.textContent=x.text;sel.append(o)});sel.value=focus||'';sel.disabled=!!focus;document.querySelector('.focuscircle').classList.toggle('spinning',!!focus);const chosen=choices.find(x=>x.key===focus);name.textContent=chosen?chosen.text:'Escolha uma tarefa';finish.hidden=!chosen}document.getElementById('focusSelect').onchange=e=>{if(focus){render();return}focus=e.target.value||null;saveFocus();render()};document.getElementById('focusFinish').onclick=()=>{if(!focus)return;if(focus.startsWith('fixed:')){finishFixed(Number(focus.slice(6)))}else if(focus.startsWith('other:')){const t=tasks.find(x=>String(x.id)===focus.slice(6));if(t&&!t.done){t.done=true;t.completedAt=new Date().toISOString();save()}}focus=null;saveFocus();tab='done';render()};function render(){renderFocus();document.getElementById('focusPanel').hidden=tab!=='pending';document.getElementById('fixedPanel').hidden=section!=='fixed';document.getElementById('otherPanel').hidden=section!=='other';document.getElementById('fixedTab').classList.toggle('active',section==='fixed');document.getElementById('otherTab').classList.toggle('active',section==='other');document.getElementById('form').hidden=tab==='more'||section!=='other';document.getElementById('morePanel').hidden=tab!=='more';document.getElementById('tasksPanel').hidden=tab==='more';document.getElementById('moreTab').classList.toggle('active',tab==='more');renderCalendar();list.replaceChildren();fixedList.replaceChildren();document.getElementById('cycleTitle').textContent='Ciclo '+cycle.number;document.getElementById('counter').textContent=cycle.done.length+'/48 feitos';document.getElementById('history').textContent=cycle.history.length?'Ciclos anteriores concluídos: '+cycle.history.map(h=>'Ciclo '+h.number+' ('+new Date(h.finishedAt).toLocaleDateString('pt-BR')+')').join(' • '):'';FIXED.forEach((name,i)=>{const done=cycle.done.includes(i);if(done!==(tab==='done'))return;const li=document.createElement('li');li.className='fixed'+(done?' done':'');const num=document.createElement('span');num.className='num';num.textContent=(i+1)+'.';const label=document.createElement('span');label.textContent=name;const stamp=cycle.records.find(r=>r.cycle===cycle.number&&r.index===i);if(done&&stamp){const w=document.createElement('small');w.className='when';w.textContent=new Date(stamp.at).toLocaleString('pt-BR');label.append(w)}const b=document.createElement('button');b.type='button';b.className='ok';b.textContent=done?'Desfazer':'OK';b.onclick=()=>{if(!done&&focus==='fixed:'+i){document.getElementById('focusFinish').click();return}if(done)undoFixed(i);else finishFixed(i)};li.append(num,label,b);fixedList.append(li)});pendingTab.classList.toggle('active',tab==='pending');doneTab.classList.toggle('active',tab==='done');const visible=tasks.filter(t=>!!t.done===(tab==='done'));empty.hidden=tab==='more'||(section==='fixed'?fixedList.childElementCount>0:visible.length>0);empty.textContent=tab==='done'?'Nenhuma tarefa concluída.':'Nenhuma tarefa pendente.';visible.forEach(t=>{const li=document.createElement('li');if(t.done)li.className='done';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Concluir tarefa');cb.onchange=()=>{if(focus==='other:'+t.id&&!t.done){document.getElementById('focusFinish').click();return}t.done=cb.checked;t.completedAt=cb.checked?new Date().toISOString():null;save();render()};const span=document.createElement('span');span.textContent=t.text;if(t.done&&t.completedAt){const w=document.createElement('small');w.className='when';w.textContent=new Date(t.completedAt).toLocaleString('pt-BR');span.append(w)}const del=document.createElement('button');del.type='button';del.textContent='Excluir';del.disabled=focus==='other:'+t.id;del.title=del.disabled?'Conclua a tarefa em foco antes de excluí-la':'';del.onclick=()=>{if(focus==='other:'+t.id)return;tasks=tasks.filter(x=>x.id!==t.id);save();render()};li.append(cb,span,del);list.append(li)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();const text=field.value.trim();if(!text)return;const id=Date.now()+'-'+Math.random();tasks.unshift({id,text,done:false,completedAt:null});if(!focus){focus='other:'+id;saveFocus()}save();field.value='';tab='pending';render();field.focus()};render();let installPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e});document.getElementById("install").onclick=async()=>{if(installPrompt){const p=installPrompt;installPrompt=null;await p.prompt()}else alert("Para instalar: abra o menu do navegador (⋮) e toque em Instalar aplicativo ou Adicionar à tela inicial.")};if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
